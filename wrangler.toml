name = "gs-mcp"
main = "src/entry/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [{ pattern = "mcp.globalshopaholics.com", custom_domain = true, zone_name = "globalshopaholics.com" }]

[vars]
GS_RATES_URL = "https://globalshopaholics.com/wp-json/rate-calculator/v2/getrates"
GS_RATES_REFERER = "https://globalshopaholics.com/international-shipping-calculator/"
GS_USER_AGENT = "GlobalShopaholics-MCP/0.1 (+https://globalshopaholics.com)"
LEAD_RATE_LIMIT_PER_HOUR = "5"
LEAD_EMAIL_LIMIT_PER_DAY = "3"
LEAD_DAILY_CAP = "200"
RATE_LIMIT_PER_HOUR = "30"
GS_ASSISTED_FEE_PCT = "5"
GS_ASSISTED_FEE_MIN_USD = "5"
GS_ASSISTED_FEE_WAIVED_METHODS = "bank_transfer,crypto"
ALLOWED_ORIGINS = "*"
GHL_LOCATION_ID = "cbpCVcgP2Eci9eEvs2Xc"

# EASYSHIP_API_KEY (optional): fallback duty/tax API for countries without a GS profile.
# Secrets (set with `wrangler secret put NAME`, never commit):
# GS_RATES_HEADER_NAME, GS_RATES_HEADER_VALUE, GHL_API_TOKEN,
# LEAD_WEBHOOK_URL, LEAD_WEBHOOK_SECRET, EASYSHIP_API_KEY

# SQLite-backed Durable Object (Workers free plan). Stores lead + rate-tool limits.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "LimiterDO"

[[durable_objects.bindings]]
name = "DUTY_CACHE"
class_name = "DutyCacheDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LimiterDO"]

# Permanent duty-rate store (country + HS6) for the fallback lookup.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["DutyCacheDO"]
